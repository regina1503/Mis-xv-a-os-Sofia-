<body class="font-sans antialiased overflow-x-hidden bg-black">

    <!-- SECCIÓN 1 / PÁGINA 1 -->
    <section class="bg-section-1 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 2 / PÁGINA 2 -->
    <section class="bg-section-2 h-screen w-full relative flex flex-col items-center px-4" style="padding-top: 20vh;">
        
        <!-- Reproductor de Música Minimalista Centrado (Azul Plumbago) - Bajado 5% (de 15vh a 20vh) y Aumentado un 3% (w-14 h-14 a w-16 h-16) -->
        <div class="z-50">
            <button id="playBtn" onclick="toggleMusic()" class="w-16 h-16 rounded-full bg-plumbago text-white flex items-center justify-center shadow-xl hover:bg-plumbagoDark hover:scale-105 transition-all border-2 border-white/40 backdrop-blur-sm">
                <i id="playIcon" class="fa-solid fa-play text-2xl ml-0.5"></i>
            </button>
            <!-- Audio Tag -->
            <audio id="bgAudio" loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
        </div>

    </section>

    <!-- SECCIÓN 3 / PÁGINA 3 -->
    <section class="bg-section-3 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 4 / PÁGINA 4 -->
    <section class="bg-section-4 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 5 / PÁGINA 5 -->
    <section class="bg-section-5 h-screen w-full relative flex flex-col items-center justify-between py-12 px-4" style="padding-top: 21vh; padding-bottom: 2vh;">
        <!-- Espaciador superior -->
        <div></div>

        <!-- Botón Ubicación - Centro (Subido un 6%, de 27vh a 21vh) -->
        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" 
           class="bg-plumbago hover:bg-plumbagoDark text-white font-medium py-3 px-6 rounded-full shadow-lg border border-white/30 backdrop-blur-sm flex items-center gap-2 transform hover:scale-105 transition-all">

            <span>Ubicación</span>
        </a>

        <!-- Botón Ubicación - Al Final -->

           class="bg-plumbago hover:bg-plumbagoDark text-white font-medium py-3 px-6 rounded-full shadow-lg border border-white/30 backdrop-blur-sm flex items-center gap-2 transform hover:scale-105 transition-all mb-0">
            <i class="fa-solid fa-location-dot"></i>
            <span>Ubicación</span>
        </a>
    </section>

    <!-- SECCIÓN 6 / PÁGINA 6 -->
    <section class="bg-section-6 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 7 / PÁGINA 7 -->
    <section class="bg-section-7 h-screen w-full relative flex flex-col items-center justify-center p-4">
        <!-- Tarjeta de Confirmación de Pases Personalizada (Sin fondo y subida un 10%) -->
        <div class="p-6 md:p-8 max-w-sm w-full text-center border-0 transform -translate-y-[10vh] transition-all">
            <h2 class="text-2xl font-bold text-plumbagoDark mb-1">Pases Reservados</h2>
            <div class="w-12 h-1 bg-plumbago mx-auto rounded-full mb-4"></div>

            <p class="text-xs uppercase tracking-widest text-gray-600 font-semibold mb-1">Invitado Especial</p>
            <h3 id="guestName" class="text-xl font-bold text-gray-900 mb-4 capitalize">Familia Invitada</h3>

            <div class="bg-plumbago/15 rounded-2xl p-4 mb-5 border border-plumbago/30 backdrop-blur-xs">
                <span class="text-sm text-gray-800 font-medium block mb-1">Hemos reservado para ti:</span>
                <span id="maxPassesText" class="text-3xl font-extrabold text-plumbagoDark">1</span>
                <span class="text-sm font-bold text-plumbagoDark block mt-0.5">pase(s) individual(es)</span>
            </div>

            <!-- Selector de Asistencia -->
            <div class="mb-5 text-left">
                <label for="confirmedPasses" class="block text-xs font-bold text-gray-800 uppercase mb-2">
                    Confirma número de asistentes:
                </label>
                <div class="flex items-center gap-2">
                    <select id="confirmedPasses" class="w-full bg-white/90 border border-plumbago/30 rounded-xl px-4 py-2.5 text-gray-800 font-semibold focus:outline-none focus:ring-2 focus:ring-plumbago shadow-md">
                        <!-- Opciones generadas dinámicamente con JavaScript -->
                    </select>
                </div>
            </div>

            <!-- Botón de Confirmar Asistencia por WhatsApp -->
            <button onclick="sendRSVP()" class="w-full bg-plumbago hover:bg-plumbagoDark text-white font-bold py-3 px-6 rounded-xl shadow-lg border border-white/30 flex items-center justify-center gap-2 transform active:scale-95 hover:scale-105 transition-all">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Confirmar Asistencia</span>
            </button>
        </div>
    </section>

    <!-- Script para reproductor y lógica de pases por URL -->
    <script>
        const bgAudio = document.getElementById('bgAudio');
        const playIcon = document.getElementById('playIcon');

        function toggleMusic() {
            if (bgAudio.paused) {
                bgAudio.play();
                playIcon.classList.remove('fa-play', 'ml-0.5');
                playIcon.classList.add('fa-pause');
            } else {
                bgAudio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-0.5');
            }
        }

        /* LÓGICA DE PASES PERSONALIZADOS VÍA PARÁMETROS URL */
        // Configura el número de teléfono donde recibirás los mensajes de confirmación de WhatsApp
        const TELEFONO_WHATSAPP = "5210000000000"; 

        let maxPasses = 1;
        let guestName = "Familia Invitada";

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Obtener parámetro 'nombre' (Ej: ?nombre=Familia+Perez)
            if (urlParams.has('nombre')) {
                guestName = urlParams.get('nombre');
            }
            
            // Obtener parámetro 'pases' (Ej: ?pases=5)
            if (urlParams.has('pases')) {
                const parsedPasses = parseInt(urlParams.get('pases'));
                if (!isNaN(parsedPasses) && parsedPasses > 0) {
                    maxPasses = parsedPasses;
                }
            }

            // Actualizar interfaz
            document.getElementById('guestName').innerText = guestName;
            document.getElementById('maxPassesText').innerText = maxPasses;

            // Llenar el selector dinámicamente sin exceder maxPasses
            const selectElement = document.getElementById('confirmedPasses');
            selectElement.innerHTML = '';
            for (let i = 1; i <= maxPasses; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i} ${i === 1 ? 'Persona' : 'Personas'}`;
                selectElement.appendChild(option);
            }
        });

        function sendRSVP() {
            const confirmedCount = document.getElementById('confirmedPasses').value;
            const message = `¡Hola! Confirmo mi asistencia a los XV Años de Sofía. 🩵%0A%0A*Invitado:* ${encodeURIComponent(guestName)}%0A*Pases asignados:* ${maxPasses}%0A*Asistentes confirmados:* ${confirmedCount}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${message}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
