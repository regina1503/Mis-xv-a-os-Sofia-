<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta tags para la vista previa al compartir en WhatsApp, Messenger, etc. -->

    <meta property="og:description" content="Te invito a celebrar conmigo este día tan especial.">
    <meta property="og:image" content="https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/portada%20(3).jpg">
    <meta property="og:type" content="website">

    <!-- Meta tags para Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mis XV Años - Sofía 🩵">
    <meta name="twitter:description" content="Te invito a celebrar conmigo este día tan especial.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/portada%20(3).jpg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        roseGold: '#B76E79',
                        plumbago: '#4A6B82', // Color Azul Plumbago
                        plumbagoDark: '#365266',
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        .bg-section-1 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/Agregar%20un%20subt%C3%ADtulo%20(10).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-section-2 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/Agregar%20un%20subt%C3%ADtulo%20(8).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-section-3 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/Agregar%20un%20subt%C3%ADtulo%20(13).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-section-4 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/Agregar%20un%20subt%C3%ADtulo%20(12).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-section-5 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Mis-xv-a-os-Sofia-/main/Agregar%20un%20subt%C3%ADtulo%20(14).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="font-sans antialiased overflow-x-hidden bg-black">

    <!-- SECCIÓN 1 / PÁGINA 1 -->
    <section class="bg-section-1 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 2 / PÁGINA 2 -->
    <section class="bg-section-2 h-screen w-full relative flex flex-col items-center px-4" style="padding-top: 15vh;">
        
        <!-- Reproductor de Música Minimalista Centrado (Azul Plumbago) -->
        <div class="z-50">
            <button id="playBtn" onclick="toggleMusic()" class="w-14 h-14 rounded-full bg-plumbago text-white flex items-center justify-center shadow-xl hover:bg-plumbagoDark hover:scale-105 transition-all border-2 border-white/40 backdrop-blur-sm">
                <i id="playIcon" class="fa-solid fa-play text-xl ml-0.5"></i>
            </button>
            <!-- Audio Tag -->
            <audio id="bgAudio" loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
        </div>

    </section>

    <!-- SECCIÓN 3 / PÁGINA 3 -->
    <section class="bg-section-3 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 4 / PÁGINA 4 -->
    <section class="bg-section-4 h-screen w-full relative">
    </section>

    <!-- SECCIÓN 5 / PÁGINA 5 -->
    <section class="bg-section-5 h-screen w-full relative flex flex-col items-center justify-between py-12 px-4" style="padding-top: 27vh; padding-bottom: 2vh;">
        <!-- Espaciador superior -->
        <div></div>

        <!-- Botón Ubicación - Centro (bajado un 12%) -->
        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" 
           class="bg-plumbago hover:bg-plumbagoDark text-white font-medium py-3 px-6 rounded-full shadow-lg border border-white/30 backdrop-blur-sm flex items-center gap-2 transform hover:scale-105 transition-all">
            <i class="fa-solid fa-location-dot"></i>
            <span>Ubicación</span>
        </a>

        <!-- Botón Ubicación - Al Final (bajado un 12%) -->
        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" 
           class="bg-plumbago hover:bg-plumbagoDark text-white font-medium py-3 px-6 rounded-full shadow-lg border border-white/30 backdrop-blur-sm flex items-center gap-2 transform hover:scale-105 transition-all mb-0">
            <i class="fa-solid fa-location-dot"></i>
            <span>Ubicación</span>
        </a>
    </section>

    <!-- Script para reproductor -->
    <script>
        const bgAudio = document.getElementById('bgAudio');
        const playIcon = document.getElementById('playIcon');

        function toggleMusic() {
            if (bgAudio.paused) {
                bgAudio.play();
                playIcon.classList.remove('fa-play', 'ml-0.5');
                playIcon.classList.add('fa-pause');
            } else {
                bgAudio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-0.5');
            }
        }
    </script>
</body>
</html>
