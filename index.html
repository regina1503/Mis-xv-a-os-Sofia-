<body class="font-sans antialiased overflow-x-hidden bg-black">

    <!-- SECCIÓN 2 / PÁGINA 2 -->

    <!-- SECCIÓN 5 / PÁGINA 5 -->
    <section class="bg-section-5 h-screen w-full relative flex flex-col items-center justify-between py-12 px-4" style="padding-top: 13vh; padding-bottom: 2vh;">
        <!-- Espaciador superior subido un 2% adicional (de 15vh a 13vh) -->

        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer"

            <i class="fa-solid fa-location-dot"></i>
            <span>Ubicación</span>
        </a>

        <!-- Botón Ubicación - Al Final -->
        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer" 
           class="bg-plumbago hover:bg-plumbagoDark text-white font-medium py-3 px-6 rounded-full shadow-lg border border-white/30 backdrop-blur-sm flex items-center gap-2 transform hover:scale-105 transition-all mb-0">
            <i class="fa-solid fa-location-dot"></i>

    <!-- SECCIÓN 7 / PÁGINA 7 -->
    <section class="bg-section-7 h-screen w-full relative flex flex-col items-center justify-center p-4">
        <!-- Tarjeta de Confirmación de Pases Personalizada en Pasos (Subida un 8% adicional: de -10vh a -18vh) -->
        <div class="p-6 md:p-8 max-w-sm w-full text-center border-0 transform -translate-y-[18vh] transition-all">

            <!-- PASO 1: Mostrar Invitado y Pases -->
            <div id="step1" class="transition-all duration-300">
                <h3 id="guestName" class="text-2xl font-bold font-serif italic text-plumbagoDark mb-5 capitalize">Familia Invitada</h3>

                <div class="bg-plumbago/15 rounded-2xl p-3.5 mb-5 border border-plumbago/30 backdrop-blur-xs">
                    <span class="text-xs text-gray-800 font-medium block mb-0.5">Hemos reservado para ti:</span>
                    <span id="maxPassesText" class="text-3xl font-extrabold text-plumbagoDark">1</span>
                    <span class="text-xs font-bold text-plumbagoDark block mt-0.5">pase(s) individual(es)</span>
                </div>

                <button onclick="goToStep(2)" class="w-full bg-plumbago hover:bg-plumbagoDark text-white font-bold py-2.5 px-6 rounded-xl shadow-lg border border-white/30 flex items-center justify-center gap-2 transform active:scale-95 hover:scale-105 transition-all text-sm">
                    <span>Continuar a Confirmación</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- PASO 2: ¿Asistirán o no? -->
            <div id="step2" class="hidden transition-all duration-300">
                <p class="text-xs uppercase tracking-widest text-gray-600 font-semibold mb-1">¿Nos acompañarás?</p>
                <h3 class="text-lg font-bold text-gray-900 mb-5">Confirma tu respuesta</h3>

                <div class="flex gap-3 mb-5">
                    <button onclick="handleAttendance(true)" class="flex-1 bg-plumbago hover:bg-plumbagoDark text-white font-bold py-2.5 px-4 rounded-xl shadow-md border border-white/30 transition-all text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> Sí Asistiré
                    </button>
                    <button onclick="handleAttendance(false)" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-md border border-white/30 transition-all text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-xmark"></i> No Podré
                    </button>
                </div>

                <button onclick="goToStep(1)" class="text-xs text-plumbagoDark font-semibold hover:underline">
                    <i class="fa-solid fa-arrow-left"></i> Regresar
                </button>
            </div>

            <!-- PASO 3: Selección de asistentes (solo si asiste) y WhatsApp -->
            <div id="step3" class="hidden transition-all duration-300">
                <p class="text-xs uppercase tracking-widest text-gray-600 font-semibold mb-1">Número de Asistentes</p>
                <h3 class="text-lg font-bold text-gray-900 mb-4">¿Cuántos asistirán?</h3>

                <div class="mb-5 text-left">
                    <label for="confirmedPasses" class="block text-[11px] font-bold text-gray-800 uppercase mb-1.5">
                        Selecciona cantidad (Máx. <span id="maxLimitLabel">1</span>):
                    </label>
                    <select id="confirmedPasses" class="w-full bg-white/90 border border-plumbago/30 rounded-xl px-3 py-2 text-sm text-gray-800 font-semibold focus:outline-none focus:ring-2 focus:ring-plumbago shadow-md">
                        <!-- Opciones generadas dinámicamente -->
                    </select>
                </div>

                <div class="flex flex-col gap-2.5">
                    <button onclick="sendRSVP()" class="w-full bg-plumbago hover:bg-plumbagoDark text-white font-bold py-2.5 px-6 rounded-xl shadow-lg border border-white/30 flex items-center justify-center gap-2 transform active:scale-95 hover:scale-105 transition-all text-sm">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        <span>Enviar Confirmación</span>
                    </button>
                    <button onclick="goToStep(2)" class="text-xs text-plumbagoDark font-semibold hover:underline mt-1">
                        <i class="fa-solid fa-arrow-left"></i> Regresar
                    </button>
                </div>
            </div>

            <!-- PASO 4: Mensaje si No Asiste -->
            <div id="step4" class="hidden transition-all duration-300">
                <div class="bg-gray-200/50 rounded-2xl p-4 mb-5 border border-gray-300 backdrop-blur-xs">
                    <p class="text-sm text-gray-800 font-medium">Lamentamos que no nos acompañes, ¡gracias por avisarnos!</p>
                </div>
                <button onclick="sendNoRSVP()" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg border border-white/30 flex items-center justify-center gap-2 transform active:scale-95 transition-all text-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Avisar por WhatsApp</span>
                </button>
                <button onclick="goToStep(2)" class="text-xs text-plumbagoDark font-semibold hover:underline mt-3 block">

    <!-- SECCIÓN 8 / PÁGINA 8 (CUENTA REGRESIVA REVISADA: SOLO NÚMEROS EN CÍRCULOS Y TEXTO DEBAJO EN AZUL) -->
    <section class="bg-section-8 h-screen w-full relative flex flex-col items-center justify-center p-4">
        <div class="text-center text-white p-4 max-w-sm w-full transform -translate-y-[24vh]">

            <!-- Grid de Cuenta Regresiva con Círculos Ajustados (Reducidos un 8% adicional) -->
            <div class="grid grid-cols-4 gap-2 text-center">
                <!-- DÍAS -->
                <div class="flex flex-col items-center">
                    <div class="flex items-center justify-center w-[62px] h-[62px] md:w-[76px] md:h-[76px] bg-plumbago/85 rounded-full border border-white/40 shadow-lg backdrop-blur-xs">
                        <span id="cd-days" class="text-xl md:text-2xl font-extrabold font-mono leading-none text-white">00</span>
                    </div>
                    <span class="text-[10px] md:text-xs uppercase font-extrabold text-plumbagoDark mt-1.5 drop-shadow-sm tracking-wider">Días</span>
                </div>

                <!-- HORAS -->
                <div class="flex flex-col items-center">
                    <div class="flex items-center justify-center w-[62px] h-[62px] md:w-[76px] md:h-[76px] bg-plumbago/85 rounded-full border border-white/40 shadow-lg backdrop-blur-xs">
                        <span id="cd-hours" class="text-xl md:text-2xl font-extrabold font-mono leading-none text-white">00</span>
                    </div>
                    <span class="text-[10px] md:text-xs uppercase font-extrabold text-plumbagoDark mt-1.5 drop-shadow-sm tracking-wider">Horas</span>
                </div>

                <!-- MINUTOS -->
                <div class="flex flex-col items-center">
                    <div class="flex items-center justify-center w-[62px] h-[62px] md:w-[76px] md:h-[76px] bg-plumbago/85 rounded-full border border-white/40 shadow-lg backdrop-blur-xs">
                        <span id="cd-minutes" class="text-xl md:text-2xl font-extrabold font-mono leading-none text-white">00</span>
                    </div>
                    <span class="text-[10px] md:text-xs uppercase font-extrabold text-plumbagoDark mt-1.5 drop-shadow-sm tracking-wider">Min</span>
                </div>

                <!-- SEGUNDOS -->
                <div class="flex flex-col items-center">
                    <div class="flex items-center justify-center w-[62px] h-[62px] md:w-[76px] md:h-[76px] bg-plumbago/85 rounded-full border border-white/40 shadow-lg backdrop-blur-xs">
                        <span id="cd-seconds" class="text-xl md:text-2xl font-extrabold font-mono leading-none text-white">00</span>
                    </div>
                    <span class="text-[10px] md:text-xs uppercase font-extrabold text-plumbagoDark mt-1.5 drop-shadow-sm tracking-wider">Seg</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Script para reproductor, lógica de pases por URL y Cuenta Regresiva -->
    <script>
        const bgAudio = document.getElementById('bgAudio');
        const playIcon = document.getElementById('playIcon');

        function toggleMusic() {
            if (bgAudio.paused) {
                bgAudio.play();
                playIcon.classList.remove('fa-play', 'ml-0.5');
                playIcon.classList.add('fa-pause');
            } else {
                bgAudio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-0.5');
            }
        }

        /* LÓGICA DE PASES PERSONALIZADOS VÍA PARÁMETROS URL */
        const TELEFONO_WHATSAPP = "5210000000000"; 

        let maxPasses = 1;
        let guestName = "Familia Invitada";

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('nombre')) {
                guestName = urlParams.get('nombre');
            }
            
            if (urlParams.has('pases')) {
                const parsedPasses = parseInt(urlParams.get('pases'));
                if (!isNaN(parsedPasses) && parsedPasses > 0) {
                    maxPasses = parsedPasses;
                }
            }

            document.getElementById('guestName').innerText = guestName;
            document.getElementById('maxPassesText').innerText = maxPasses;
            document.getElementById('maxLimitLabel').innerText = maxPasses;

            const selectElement = document.getElementById('confirmedPasses');
            selectElement.innerHTML = '';
            for (let i = 1; i <= maxPasses; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i} ${i === 1 ? 'Persona' : 'Personas'}`;
                selectElement.appendChild(option);
            }

            // Inicializar la cuenta regresiva
            startCountdown();
        });

        function goToStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.add('hidden');

            document.getElementById(`step${step}`).classList.remove('hidden');
        }

        function handleAttendance(willAttend) {
            if (willAttend) {
                goToStep(3);
            } else {
                goToStep(4);
            }
        }

        function sendRSVP() {
            const confirmedCount = document.getElementById('confirmedPasses').value;
            const message = `¡Hola! Confirmo mi asistencia a los XV Años de Sofía. 🩵%0A%0A*Invitado:* ${encodeURIComponent(guestName)}%0A*Pases asignados:* ${maxPasses}%0A*Asistentes confirmados:* ${confirmedCount}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        function sendNoRSVP() {
            const message = `¡Hola! Lamento mucho informar que no podré asistir a los XV Años de Sofía. 🩵%0A%0A*Invitado:* ${encodeURIComponent(guestName)}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        /* LÓGICA DE CUENTA REGRESIVA (5 DICIEMBRE 2026) */
        function startCountdown() {
            const eventDate = new Date("December 5, 2026 00:00:00").getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const distance = eventDate - now;

                if (distance < 0) {
                    document.getElementById("cd-days").innerText = "00";
                    document.getElementById("cd-hours").innerText = "00";
                    document.getElementById("cd-minutes").innerText = "00";
                    document.getElementById("cd-seconds").innerText = "00";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("cd-days").innerText = days < 10 ? '0' + days : days;
                document.getElementById("cd-hours").innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById("cd-minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById("cd-seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }
    </script>
